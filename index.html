<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhakti & Bougie Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1628;
      --navy-mid: #0f2040;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-pale: #f5e6c0;
      --cream: #f8f3e8;
      --white: #ffffff;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--navy);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      overflow: hidden;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 20%, rgba(201,168,76,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #0f2040 0%, #0a1628 100%);
      z-index: 0;
    }

    /* Grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Top ornament */
    .ornament {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.2s;
    }

    .ornament::before,
    .ornament::after {
      content: '◆';
      position: absolute;
      top: -5px;
      font-size: 8px;
      color: var(--gold);
    }
    .ornament::before { left: 50%; transform: translateX(-50%); }

    /* Logo mark — tripundra lines */
    .mark {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.4s;
    }

    .mark-line {
      height: 2.5px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      border-radius: 2px;
    }
    .mark-line:nth-child(1) { width: 48px; align-self: center; }
    .mark-line:nth-child(2) { width: 36px; align-self: center; }
    .mark-line:nth-child(3) { width: 24px; align-self: center; }

    /* Brand name */
    .brand {
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.6s;
      margin-bottom: 0.4rem;
    }

    .brand-main {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 500;
      letter-spacing: 0.25em;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .brand-amp {
      color: var(--gold);
      font-weight: 400;
      margin: 0 0.15em;
    }

    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.45em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 0.5rem;
      opacity: 0.8;
    }

    /* Divider */
    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2.2rem auto;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.8s;
    }

    /* Main message */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
      line-height: 1.3;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1s;
    }

    .subtext {
      font-family: 'Jost', sans-serif;
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      color: rgba(248,243,232,0.55);
      text-transform: uppercase;
      line-height: 1.8;
      max-width: 420px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.2s;
    }

    /* Contact line */
    .contact {
      margin-top: 2.8rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.5s;
    }

    .contact-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }

    .contact a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--gold-light);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }

    .contact a:hover {
      color: var(--white);
    }

    /* Bottom ornament */
    .bottom-ornament {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.8s;
    }

    .bottom-ornament span {
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(201,168,76,0.35);
      font-family: 'Jost', sans-serif;
      font-weight: 200;
    }

    .bottom-ornament::before,
    .bottom-ornament::after {
      content: '';
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3));
    }
    .bottom-ornament::after {
      background: linear-gradient(90deg, rgba(201,168,76,0.3), transparent);
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Subtle gold pulse on the mark */
    @keyframes glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .mark { animation: fadeUp 1s ease forwards 0.4s, glow 4s ease-in-out infinite 2s; }

  </style>
</head>
<body>
  <div class="container">

    <div class="ornament"></div>

    <div class="mark">
      <div class="mark-line"></div>
      <div class="mark-line"></div>
      <div class="mark-line"></div>
    </div>

    <div class="brand">
      <div class="brand-main">Bhakti <span class="brand-amp">&</span> Bougie</div>
      <div class="brand-sub">Curated India Travel</div>
    </div>

    <div class="divider"></div>

    <div class="headline">Something beautiful<br>is on its way.</div>

    <div class="subtext">
      We are crafting an experience<br>
      worthy of the journey.
    </div>

    <div class="contact">
      <div class="contact-label">Enquiries</div>
      <a href="mailto:hello@bhaktiandbougie.travel">hello@bhaktiandbougie.travel</a>
    </div>

  </div>

  <div class="bottom-ornament">
    <span>bhaktiandbougie.travel</span>
  </div>

</body>
</html>
