<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Bhakti &amp; Bougie</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="B&amp;B Travel"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<meta name="theme-color" content="#0D1B2A"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
a{color:var(--gold);}
:root{
  --navy:#0D1B2A;--navy2:#111e2d;--navy3:#162333;
  --gold:#C8860A;--gold2:#e09b18;--gold-dim:rgba(200,134,10,0.15);--gold-border:rgba(200,134,10,0.3);
  --cream:#F2E6CC;--cream2:#E8D9B8;--cream-dim:rgba(242,230,204,0.6);
  --crimson:#8B1A1A;--ash:#9A9490;
  --muted:#6A8AAA;--green:#4a9e5c;--red:#cc4444;
  --border:rgba(200,134,10,0.25);--border-subtle:rgba(242,230,204,0.08);
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'Jost',sans-serif;
  --nav-h:64px;
}
html,body{height:100%;background:var(--navy);color:var(--cream);font-family:var(--font-sans);font-weight:300;overflow:hidden;}

/* ── Password screen ─── */
#pw-screen{
  position:fixed;inset:0;background:var(--navy);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;
  padding:40px 24px;transition:opacity 0.4s;
}
#pw-screen.hidden{opacity:0;pointer-events:none;}
.pw-mark{display:flex;flex-direction:column;gap:5px;align-items:center;}
.pw-s{width:52px;height:10px;background:var(--ash);border-radius:5px;border:1.5px solid var(--gold);position:relative;}
.pw-s.mid .pw-eye{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--gold);left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #111;}
.pw-s.mid .pw-eye::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--crimson);left:50%;top:50%;transform:translate(-50%,-50%);border:1.5px solid #111;}
.pw-title{font-family:var(--font-serif);font-size:28px;color:var(--cream);letter-spacing:5px;text-align:center;}
.pw-rule{width:50px;height:1px;background:var(--gold);}
.pw-sub{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;text-align:center;}
#pw-input{
  background:var(--navy2);border:1.5px solid var(--gold-border);border-radius:3px;
  padding:14px 20px;font-family:var(--font-sans);font-size:16px;color:var(--cream);
  outline:none;width:280px;text-align:center;letter-spacing:3px;-webkit-appearance:none;
}
#pw-input:focus{border-color:var(--gold);}
#pw-btn{
  background:transparent;border:1.5px solid var(--gold-border);border-radius:3px;
  padding:14px 32px;font-family:var(--font-sans);font-size:12px;font-weight:500;
  color:var(--gold);cursor:pointer;letter-spacing:3px;text-transform:uppercase;
  min-height:44px;width:280px;
}
#pw-error{font-size:12px;color:var(--red);min-height:16px;text-align:center;}
#pw-msg{font-size:13px;color:var(--cream-dim);letter-spacing:1px;text-align:center;}

/* ── App shell ─── */
#app{
  display:none;flex-direction:column;
  height:100vh;height:100dvh;
  max-width:430px;margin:0 auto;
  overflow:hidden;
}

/* ── Tab panels ─── */
.tab-panel{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.tab-panel.active{display:flex;}

/* ── Today: header ─── */
#today-header{
  background:var(--navy2);border-bottom:1px solid var(--border);
  padding:14px 14px 12px;flex-shrink:0;
}
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.nav-arrow{
  background:transparent;border:1px solid var(--gold-border);border-radius:2px;
  color:var(--gold);font-size:26px;cursor:pointer;
  width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-arrow:disabled{opacity:0.25;cursor:default;}
.day-label{font-family:var(--font-serif);font-size:28px;color:var(--cream);letter-spacing:2px;text-align:center;flex:1;line-height:1.2;}
.day-location{font-size:20px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-top:6px;}
.day-title-txt{font-size:18px;color:var(--cream-dim);text-align:center;margin-top:4px;font-style:italic;}

/* ── Today: content ─── */
#today-content{flex:1;overflow-y:auto;min-height:0;padding:14px 14px 14px;-webkit-overflow-scrolling:touch;}

/* ── Timeline items ─── */
.tl-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:18px 14px;min-height:80px;background:var(--navy2);border:1px solid var(--border);
  border-radius:4px;margin-bottom:12px;
}
.tl-item.tl-sacred{border-left:3px solid var(--crimson);}
.tl-item.tl-activity{border-left:3px solid var(--gold);}
.tl-item.tl-dining{border-left:3px solid var(--gold);}
.tl-doc-btn{display:inline-block;margin-top:8px;font-size:13px;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-border);padding-bottom:1px;}
.tl-time{
  font-family:var(--font-serif);font-size:20px;color:var(--gold);
  min-width:52px;flex-shrink:0;padding-top:2px;text-align:right;line-height:1;
}
.tl-time.empty{visibility:hidden;}
.tl-icon{font-size:24px;flex-shrink:0;line-height:1;padding-top:2px;}
.tl-body{flex:1;min-width:0;}
.tl-lbl{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.tl-lbl.gold{color:var(--gold);}
.tl-lbl.crimson{color:var(--crimson);}
.tl-main{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--cream);line-height:1.25;}
.tl-main.crimson{color:#c44;}
.tl-sub{font-size:18px;color:var(--ash);margin-top:5px;line-height:1.4;}
.tl-sub.crimson{color:#b55;}
.tl-ref{font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:3px;margin-top:8px;}
.tl-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:16px;letter-spacing:1px;}
.day-notes-card{
  padding:14px 16px;background:var(--navy3);border:1px solid var(--border-subtle);
  border-radius:4px;margin-bottom:12px;font-size:18px;color:var(--cream-dim);line-height:1.6;font-style:italic;
}

/* ── Journey tab ─── */
#journey-header{
  background:var(--navy2);border-bottom:1px solid var(--border);padding:16px;
  font-family:var(--font-serif);font-size:20px;color:var(--gold);letter-spacing:2px;flex-shrink:0;
}
#journey-content{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;}
.jday-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border-subtle);cursor:pointer;min-height:64px;
  -webkit-tap-highlight-color:transparent;
}
.jday-row:active{background:var(--navy2);}
.jday-row.is-today{border-left:3px solid var(--gold);background:var(--gold-dim);}
.jday-num{font-family:var(--font-serif);font-size:22px;color:var(--muted);min-width:36px;text-align:right;flex-shrink:0;}
.jday-row.is-today .jday-num{color:var(--gold);}
.jday-info{flex:1;min-width:0;}
.jday-date{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.jday-loc{font-family:var(--font-serif);font-size:17px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jday-icon{font-size:22px;flex-shrink:0;}

/* ── Info tab ─── */
#info-content{flex:1;overflow-y:auto;min-height:0;padding:20px 16px;-webkit-overflow-scrolling:touch;}
.info-section{margin-bottom:28px;}
.info-sec-title{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.info-trip-title{font-family:var(--font-serif);font-size:30px;color:var(--cream);margin-bottom:14px;line-height:1.2;}
.info-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--border-subtle);}
.info-key{font-size:14px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}
.info-val{font-size:18px;color:var(--cream);text-align:right;margin-left:12px;}
.info-emerg{font-size:18px;color:var(--cream-dim);line-height:1.7;padding:4px 0;}
.trav-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-subtle);}
.trav-name{font-family:var(--font-serif);font-size:20px;color:var(--cream);}
.trav-role{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.info-brand{text-align:center;padding:32px 0 12px;}
.info-brand-name{font-family:var(--font-serif);font-size:24px;color:var(--cream);letter-spacing:4px;}
.info-brand-email{font-size:16px;color:var(--gold);margin-top:8px;letter-spacing:1px;}
.trav-card{border-bottom:1px solid var(--border-subtle);}
.trav-card:last-child{border-bottom:none;}
.trav-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0;cursor:pointer;user-select:none;}
.trav-card-fullname{font-family:var(--font-serif);font-size:20px;color:var(--cream);}
.trav-card-chevron{font-size:12px;color:var(--muted);transition:transform 0.2s;}
.trav-card.open .trav-card-chevron{transform:rotate(180deg);}
.trav-card-body{display:none;padding-bottom:14px;}
.trav-card.open .trav-card-body{display:block;}
.trav-detail-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border-subtle);}
.trav-detail-row:last-child{border-bottom:none;}
.trav-detail-key{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}
.trav-detail-val{font-size:16px;color:var(--cream);text-align:right;margin-left:12px;}

/* ── Bottom nav ─── */
#bottom-nav{
  display:flex;background:var(--navy2);border-top:1px solid var(--border);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  flex-shrink:0;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:transparent;border:none;cursor:pointer;color:var(--muted);
  font-family:var(--font-sans);min-height:44px;-webkit-tap-highlight-color:transparent;
}
.nav-btn.active{color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;}

/* ── My Notes ─── */
.my-notes-card{
  margin-top:16px;padding:14px 16px;background:var(--navy3);
  border:1px solid var(--border-subtle);border-radius:4px;
}
.my-notes-label{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
.my-notes-ta{
  width:100%;min-height:100px;background:var(--navy2);
  border:1px solid var(--gold-border);border-radius:3px;
  color:var(--cream);font-family:var(--font-sans);font-size:16px;
  font-weight:300;padding:12px;resize:vertical;line-height:1.5;
  -webkit-appearance:none;outline:none;
}
.my-notes-ta::placeholder{color:var(--ash);font-style:italic;}
.my-notes-ta:focus{border-color:var(--gold);}
.my-notes-status{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:1px;min-height:16px;}

/* ── Name picker ─── */
#name-picker{
  position:fixed;inset:0;background:var(--navy);z-index:9998;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  gap:14px;padding:48px 24px;overflow-y:auto;
}
#name-picker.hidden{display:none;}
.picker-title{font-family:var(--font-serif);font-size:26px;color:var(--cream);letter-spacing:3px;text-align:center;}
.picker-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:6px;}
.picker-btn{
  background:var(--navy2);border:1.5px solid var(--gold-border);border-radius:3px;
  padding:16px 24px;width:100%;max-width:300px;
  font-family:var(--font-sans);font-size:16px;color:var(--cream);
  cursor:pointer;letter-spacing:1px;text-align:center;min-height:52px;
  -webkit-tap-highlight-color:transparent;display:block;
}
.picker-btn:active{border-color:var(--gold);background:var(--gold-dim);}
.picker-skip{
  font-size:12px;color:var(--muted);letter-spacing:1px;text-decoration:underline;
  background:none;border:none;cursor:pointer;padding:8px;margin-top:4px;
}
</style>
</head>
<body>

<div id="pw-screen">
  <div class="pw-mark">
    <div class="pw-s"></div>
    <div class="pw-s mid"><div class="pw-eye"></div></div>
    <div class="pw-s"></div>
  </div>
  <div class="pw-title">BHAKTI &amp; BOUGIE</div>
  <div class="pw-rule"></div>
  <div class="pw-sub">Journey Companion</div>
  <div id="pw-form">
    <input id="pw-input" type="password" placeholder="Password" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
    <button id="pw-btn" onclick="doAuth()">ENTER</button>
    <p id="pw-error"></p>
  </div>
  <div id="pw-msg" style="display:none"></div>
</div>

<div id="name-picker" class="hidden">
  <div class="picker-title">WHO ARE YOU?</div>
  <div class="picker-sub">Select your name to enable journey notes</div>
  <div id="picker-list"></div>
  <button class="picker-skip" onclick="document.getElementById('name-picker').classList.add('hidden')">Skip for now</button>
</div>

<div id="app">

  <div id="tab-today" class="tab-panel active">
    <div id="today-header">
      <div id="traveler-greeting" style="display:none;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:8px;"></div>
      <div id="docs-toggle" style="display:none;text-align:center;font-size:11px;color:var(--gold);text-decoration:underline;margin-bottom:8px;cursor:pointer;" onclick="toggleShowAllDocs()"></div>
      <div class="day-nav">
        <button class="nav-arrow" id="btn-prev" onclick="navigateDay(-1)">‹</button>
        <div id="day-label" class="day-label"></div>
        <button class="nav-arrow" id="btn-next" onclick="navigateDay(1)">›</button>
      </div>
      <div id="day-location" class="day-location"></div>
      <div id="day-title-txt" class="day-title-txt"></div>
    </div>
    <div id="today-content"></div>
  </div>

  <div id="tab-journey" class="tab-panel">
    <div id="journey-header">ALL DAYS</div>
    <div id="journey-content"></div>
  </div>

  <div id="tab-info" class="tab-panel">
    <div id="info-content"></div>
  </div>

  <nav id="bottom-nav">
    <button class="nav-btn" id="nav-journey" onclick="showTab('journey')">
      <div class="nav-icon">✈</div>
      <div class="nav-label">Journey</div>
    </button>
    <button class="nav-btn active" id="nav-today" onclick="showTab('today')">
      <div class="nav-icon">☀</div>
      <div class="nav-label">Today</div>
    </button>
    <button class="nav-btn" id="nav-info" onclick="showTab('info')">
      <div class="nav-icon">ℹ</div>
      <div class="nav-label">Info</div>
    </button>
  </nav>

</div>

<script>
const API='https://bhaktiandbougie-production.up.railway.app/api';
const DAY_NAMES=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MON_SHORT=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let tripId=null,trip=null,allDays=[],hotelBookings=[],transports=[],trains=[],sacredSites=[],activities=[],tripTravelers=[],flightDocs=[],showAllDocs=false;
let currentDayIdx=0,activeTab='today';
let travelerName=localStorage.getItem('travelerName')||'';

function utcHHMM(ts){
  if(!ts)return'';
  const t=String(ts).replace('Z','').split('T')[1]||'';
  return t.slice(0,5);
}
function toHHMM(ts){
  if(!ts)return'';
  const s=String(ts);
  if(s.includes('T')){
    const d=new Date(s.replace('Z','')+'+00:00');
    return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  }
  return s.slice(0,5);
}
function localDate(){
  const d=new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseHotelTime(notes,type){
  const re=type==='checkin'?/check-?in:\s*(\d{1,2}:\d{2})/i:/check-?out:\s*(\d{1,2}:\d{2})/i;
  const m=String(notes||'').match(re);
  return m?m[1]:'';
}
function fmtDayHeader(day){
  const s=(day.date||'').split('T')[0];
  const d=new Date(s+'T12:00:00');
  return`DAY ${day.day_number} · ${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MON_SHORT[d.getMonth()]}`;
}
function fmtDateShort(dateStr){
  const d=new Date((dateStr||'').split('T')[0]+'T12:00:00');
  return`${MON_SHORT[d.getMonth()]} ${d.getDate()}`;
}
function fmtDateRange(s,e){
  const ds=new Date((s||'').split('T')[0]+'T12:00:00');
  const de=new Date((e||'').split('T')[0]+'T12:00:00');
  return`${ds.getDate()} ${MON_SHORT[ds.getMonth()]} – ${de.getDate()} ${MON_SHORT[de.getMonth()]} ${de.getFullYear()}`;
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function normStr(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();
}

window.addEventListener('DOMContentLoaded',()=>{
  tripId=new URLSearchParams(location.search).get('trip');
  if(sessionStorage.getItem('mob_auth')){
    if(tripId)loadAndShow();
    else findAndLoadTrip();
  }
  document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});

  let tx=0,ty=0;
  const tc=document.getElementById('today-content');
  tc.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  tc.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx;
    const dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?navigateDay(1):navigateDay(-1);}
  },{passive:true});
});

async function findAndLoadTrip(){
  try{
    const trips=await fetch(`${API}/trips`).then(r=>r.json()).catch(()=>[]);
    const pick=trips.find(t=>t.status==='active')||trips.find(t=>t.status==='confirmed');
    if(pick){tripId=pick.id;loadAndShow();}
    else showPwMsg('No active or confirmed trip found. Add ?trip=TRIPID to the URL.');
  }catch(e){showPwMsg('Could not load trips. Add ?trip=TRIPID to the URL.');}
}

async function doAuth(){
  const pw=document.getElementById('pw-input').value;
  const errEl=document.getElementById('pw-error');
  errEl.textContent='';
  try{
    const r=await fetch(`${API}/mobile-auth`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!r.ok){errEl.textContent='Incorrect password';return;}
    sessionStorage.setItem('mob_auth','1');
    if(tripId)loadAndShow();
    else findAndLoadTrip();
  }catch(e){errEl.textContent='Connection error — check signal';}
}

function showPwMsg(msg){
  document.getElementById('pw-form').style.display='none';
  const m=document.getElementById('pw-msg');
  m.textContent=msg;m.style.display='block';
}

async function loadAndShow(){
  showPwMsg('Loading your journey…');
  try{
    [trip,transports,trains,sacredSites,activities,hotelBookings,tripTravelers,flightDocs]=await Promise.all([
      fetch(`${API}/trips/${tripId}`).then(r=>r.json()),
      fetch(`${API}/ground-transport?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/trains?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/sacred-sites?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/activities?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/hotel-bookings?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/trips/${tripId}/travelers`).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/flight-documents?trip_id=${tripId}`).then(r=>r.json()).catch(()=>[]),
    ]);
    if(trip.error){showPwMsg('Trip not found');return;}

    allDays=[...(trip.days||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));

    const today=localDate();
    currentDayIdx=allDays.findIndex(d=>(d.date||'').split('T')[0]===today);
    if(currentDayIdx<0)currentDayIdx=0;

    const ps=document.getElementById('pw-screen');
    ps.classList.add('hidden');
    setTimeout(()=>ps.style.display='none',420);
    document.getElementById('app').style.display='flex';

    renderToday();
    renderJourney();
    renderInfo();
    if(!travelerName&&tripTravelers.length)showNamePicker();
  }catch(e){
    showPwMsg('Failed to load. Check your connection.');
  }
}

function showTab(name){
  activeTab=name;
  ['today','journey','info'].forEach(t=>{
    document.getElementById(`tab-${t}`).classList.toggle('active',t===name);
    document.getElementById(`nav-${t}`).classList.toggle('active',t===name);
  });
}

function navigateDay(delta){
  const next=currentDayIdx+delta;
  if(next<0||next>=allDays.length)return;
  currentDayIdx=next;
  renderToday();
}

function goToDay(idx){
  currentDayIdx=idx;
  renderToday();
  showTab('today');
}

// ── Today ─────────────────────────────────────────────────────────────────────

function renderToday(){
  if(!allDays.length){
    document.getElementById('day-label').textContent='NO DAYS';
    document.getElementById('day-location').textContent='';
    document.getElementById('day-title-txt').textContent='';
    document.getElementById('today-content').innerHTML='<div class="tl-empty">No itinerary loaded</div>';
    return;
  }
  const day=allDays[currentDayIdx];
  const dateStr=(day.date||'').split('T')[0];

  const greet=document.getElementById('traveler-greeting');
  if(greet){if(travelerName){const tripTitle=trip?.title?` · ${trip.title}`:'';greet.textContent=travelerName+tripTitle;greet.style.display='block';}else{greet.style.display='none';}}
  const docsToggle=document.getElementById('docs-toggle');
  if(docsToggle){
    if(travelerName&&flightDocs.length){
      docsToggle.style.display='block';
      docsToggle.textContent=showAllDocs?'Showing all travelers’ documents — tap to show only mine':'Tap to show all travelers’ documents';
    }else{
      docsToggle.style.display='none';
    }
  }
  document.getElementById('day-label').textContent=fmtDayHeader(day);
  document.getElementById('day-location').textContent=day.location||'';
  const titleIsBareDay=/^day\s*\d+$/i.test(normStr(day.title||''));
  const showTitle=!titleIsBareDay&&day.title&&normStr(day.title)!==normStr(day.location||'');
  document.getElementById('day-title-txt').textContent=showTitle?day.title:'';
  document.getElementById('btn-prev').disabled=currentDayIdx===0;
  document.getElementById('btn-next').disabled=currentDayIdx===allDays.length-1;

  const items=buildDayItems(day,dateStr);
  let html='';
  if(day.notes)html+=`<div class="day-notes-card">${esc(day.notes)}</div>`;
  if(!items.length&&!day.notes)html='<div class="tl-empty">STAY DAY</div>';
  else items.forEach(it=>{html+=renderItem(it);});
  const myNotesHtml=travelerName?`<div class="my-notes-card"><div class="my-notes-label">MY NOTES</div><textarea id="my-notes-ta" class="my-notes-ta" placeholder="Add a note for this day…"></textarea><div id="my-notes-status" class="my-notes-status"></div></div>`:'';
  document.getElementById('today-content').innerHTML=html+myNotesHtml;
  document.getElementById('today-content').scrollTop=0;
  if(travelerName){
    document.getElementById('my-notes-ta').addEventListener('blur',saveCurrentNote);
    loadDayNote(day.id);
  }
}

function buildDayItems(day,dayDate){
  const items=[];

  hotelBookings.forEach(hb=>{
    if((hb.check_out||'').split('T')[0]===dayDate)
      items.push({sk:'00:00',type:'checkout',d:hb});
  });

  hotelBookings.forEach(hb=>{
    const ci=(hb.check_in||'').split('T')[0];
    const co=(hb.check_out||'').split('T')[0];
    if(ci&&co&&ci<dayDate&&dayDate<co)
      items.push({sk:'01:00',type:'staying',d:hb});
  });

  (trip.flights||[]).forEach(f=>{
    if(f.arrival_time&&f.arrival_time.slice(0,10)===dayDate)
      items.push({sk:utcHHMM(f.arrival_time)||'98:00',type:'arr',d:f});
  });

  trains.forEach(t=>{
    if((t.journey_date||'').split('T')[0]===dayDate){
      const tm=toHHMM(t.departure_time);
      items.push({sk:tm||'98:01',type:'train',d:t});
    }
  });

  (trip.flights||[]).forEach(f=>{
    if(f.departure_time&&f.departure_time.slice(0,10)===dayDate)
      items.push({sk:utcHHMM(f.departure_time)||'98:02',type:'dep',d:f});
  });

  transports.forEach(gt=>{
    if((gt.transport_date||'').split('T')[0]===dayDate){
      const tm=gt.pickup_time?gt.pickup_time.slice(0,5):'';
      items.push({sk:tm||'98:03',type:'transport',d:gt});
    }
  });

  sacredSites.forEach(s=>{
    if(s.day_id===day.id){
      const tm=s.site_time?s.site_time.slice(0,5):'';
      items.push({sk:tm||'98:10',type:'sacred',d:s});
    }
  });

  activities.forEach(a=>{
    const actDate=(allDays.find(d=>d.id===a.day_id)?.date||'').split('T')[0];
    if(actDate===dayDate){
      const tm=a.activity_time?a.activity_time.slice(0,5):'';
      items.push({sk:tm||'98:11',type:a.category==='dining'?'dining':'activity',d:a});
    }
  });

  hotelBookings.forEach(hb=>{
    if((hb.check_in||'').split('T')[0]===dayDate)
      items.push({sk:'99:99',type:'checkin',d:hb});
  });

  items.sort((a,b)=>a.sk.localeCompare(b.sk));
  return items;
}

      <div class="tl-icon">✈️</div>
      <div class="tl-body">
        <div class="tl-lbl">ARRIVING FLIGHT</div>
        <div class="tl-main">${esc((d.airline||'')+' '+(d.flight_number||''))}</div>

// ── Day notes ─────────────────────────────────────────────────────────────────

async function loadDayNote(dayId){
  if(!travelerName||!tripId)return;
  const ta=document.getElementById('my-notes-ta');
  if(!ta)return;
  const statusEl=document.getElementById('my-notes-status');
  try{
    const notes=await fetch(`${API}/notes?trip=${tripId}&traveler=${encodeURIComponent(travelerName)}`).then(r=>r.json());
    if(document.getElementById('my-notes-ta')!==ta)return;
    const note=notes.find(n=>n.day_id===dayId);
    ta.value=note?note.note_text||'':'';
    if(statusEl)statusEl.textContent='';
  }catch(e){
    if(document.getElementById('my-notes-ta')===ta&&statusEl)statusEl.textContent='Could not load note';
  }
}

async function saveCurrentNote(){
  const ta=document.getElementById('my-notes-ta');
  const statusEl=document.getElementById('my-notes-status');
  if(!ta||!travelerName||!tripId)return;
  const day=allDays[currentDayIdx];
  if(!day)return;
  if(statusEl)statusEl.textContent='Saving…';
  try{
    await fetch(`${API}/notes`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({trip_id:tripId,traveler_name:travelerName,day_id:day.id,note_text:ta.value})
    });
    if(statusEl){statusEl.textContent='Saved';setTimeout(()=>{if(statusEl)statusEl.textContent='';},2000);}
  }catch(e){
    if(statusEl)statusEl.textContent='Save failed';
  }
}

// ── Name picker ───────────────────────────────────────────────────────────────

function showNamePicker(){
  if(!tripTravelers.length)return;
  window._pickerNames=tripTravelers.map(t=>`${t.first_name||''} ${t.last_name||''}`.trim());
  const list=document.getElementById('picker-list');
  list.innerHTML=window._pickerNames.map((name,i)=>
    `<button class="picker-btn" onclick="selectTravelerName(window._pickerNames[${i}])">${esc(name)}</button>`
  ).join('');
  document.getElementById('name-picker').classList.remove('hidden');
}

function selectTravelerName(name){
  travelerName=name;
  localStorage.setItem('travelerName',name);
  document.getElementById('name-picker').classList.add('hidden');
  renderToday();
  renderJourney();
}

// ── Journey ───────────────────────────────────────────────────────────────────

function renderJourney(){
  document.getElementById('journey-header').textContent = travelerName ? `ALL DAYS · ${travelerName}` : 'ALL DAYS';
  if(!allDays.length){
    document.getElementById('journey-content').innerHTML='<div class="tl-empty">No days found</div>';
    return;
  }
  const today=localDate();
  let html='';
  allDays.forEach((day,idx)=>{
    const dateStr=(day.date||'').split('T')[0];
    const isToday=dateStr===today;
    const icon=dayPrimaryIcon(day,dateStr);
    html+=`<div class="jday-row${isToday?' is-today':''}" onclick="goToDay(${idx})">
      <div class="jday-num">${day.day_number||idx+1}</div>
      <div class="jday-info">
        <div class="jday-date">${fmtDateShort(dateStr)}${isToday?' · TODAY':''}</div>
        <div class="jday-loc">${esc(day.location||day.title||'—')}</div>
      </div>
      <div class="jday-icon">${icon}</div>
    </div>`;
  });
  document.getElementById('journey-content').innerHTML=html;
}

function docsForActivity(activityId){
  return flightDocs.filter(d=>d.activity_id===activityId);
}
function insuranceDocForTraveler(t){
  const full=`${t.first_name||''} ${t.last_name||''}`.trim().toLowerCase();
  if(!full)return null;
  return flightDocs.find(d=>!d.flight_id&&d.document_type==='insurance'&&d.traveler_name&&(d.traveler_name.toLowerCase()===full||full.includes(d.traveler_name.toLowerCase())||d.traveler_name.toLowerCase().includes(full)))||null;
}
function matchesTraveler(docName){
  if(!travelerName||!docName)return false;
  const a=travelerName.toLowerCase(),b=docName.toLowerCase();
  return a===b||a.includes(b)||b.includes(a);
}
function docsForFlight(flightId){
  return flightDocs.filter(d=>d.flight_id===flightId && (showAllDocs || !d.traveler_name || matchesTraveler(d.traveler_name)));
}
function toggleShowAllDocs(){
  showAllDocs=!showAllDocs;
  renderToday();
}
function dayPrimaryIcon(day,dateStr){
  const hasDep=(trip.flights||[]).some(f=>f.departure_time&&f.departure_time.slice(0,10)===dateStr);
  const hasArr=(trip.flights||[]).some(f=>f.arrival_time&&f.arrival_time.slice(0,10)===dateStr);
  if(hasDep||hasArr)return'✈️';
  const hasTrain=trains.some(t=>(t.journey_date||'').split('T')[0]===dateStr);
  const hasTransport=transports.some(gt=>(gt.transport_date||'').split('T')[0]===dateStr);
  if(hasTrain||hasTransport)return'🚗';
  const hasHotel=hotelBookings.some(hb=>(hb.check_in||'').split('T')[0]===dateStr||(hb.check_out||'').split('T')[0]===dateStr);
  if(hasHotel)return'🏨';
  if(sacredSites.some(s=>s.day_id===day.id))return'🛕';
  return'—';
}

// ── Info ──────────────────────────────────────────────────────────────────────

function fmtPassportExpiry(dateStr){
  if(!dateStr)return'';
  const d=new Date((dateStr||'').split('T')[0]+'T12:00:00');
  return`${d.getDate()} ${MON_SHORT[d.getMonth()]} ${d.getFullYear()}`;
}

function renderTravelerCard(t){
  const rows=[];
  if(t.phone)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">PHONE</span><span class="trav-detail-val">${esc(t.phone)}</span></div>`);
  if(t.passport_country||t.passport_expiry)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">PASSPORT</span><span class="trav-detail-val">${esc(t.passport_country||'')}${t.passport_expiry?' · exp '+fmtPassportExpiry(t.passport_expiry):''}</span></div>`);
  if(t.known_traveler_number)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">KNOWN TRAVELER #</span><span class="trav-detail-val">${esc(t.known_traveler_number)}</span></div>`);
  if(t.insurance_provider||t.insurance_policy)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">INSURANCE</span><span class="trav-detail-val">${esc(t.insurance_provider||'')}${t.insurance_policy?' · '+esc(t.insurance_policy):''}</span></div>`);
  const insDoc=insuranceDocForTraveler(t);
  if(insDoc)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">INSURANCE PDF</span><span class="trav-detail-val"><a href="${API}/flight-documents/${insDoc.id}/download" target="_blank" style="color:inherit;text-decoration:underline">📄 View Policy</a></span></div>`);
  if(t.emergency_contact_name||t.emergency_contact_phone)rows.push(`<div class="trav-detail-row"><span class="trav-detail-key">EMERGENCY</span><span class="trav-detail-val">${esc(t.emergency_contact_name||'')}${t.emergency_contact_phone?' · '+esc(t.emergency_contact_phone):''}</span></div>`);
  return`<div class="trav-card">
    <div class="trav-card-hdr" onclick="this.parentElement.classList.toggle('open')">
      <span class="trav-card-fullname">${esc(t.first_name||'')} ${esc(t.last_name||'')}</span>
      <span class="trav-card-chevron">▼</span>
    </div>
    <div class="trav-card-body">${rows.join('')}</div>
  </div>`;
}

function renderInfo(){
  if(!trip)return;
  const travelerCards=tripTravelers.length
    ?tripTravelers.map(renderTravelerCard).join('')
    :'<div class="tl-sub" style="padding:8px 0">No travelers added yet.</div>';

  document.getElementById('info-content').innerHTML=`
    <div class="info-section">
      <div class="info-trip-title">${esc(trip.title||'Untitled Trip')}</div>
      <div class="info-row"><span class="info-key">DATES</span><span class="info-val">${fmtDateRange(trip.start_date,trip.end_date)}</span></div>
      <div class="info-row"><span class="info-key">PAX</span><span class="info-val">${trip.num_pax||1} ${(trip.num_pax||1)===1?'traveller':'travellers'}</span></div>
      <div class="info-row"><span class="info-key">STATUS</span><span class="info-val">${esc((trip.status||'').toUpperCase())}</span></div>
      ${allDays.length?`<div class="info-row"><span class="info-key">DAYS</span><span class="info-val">${allDays.length}</span></div>`:''}
    </div>
    <div class="info-section">
      <div class="info-sec-title">TRAVELERS</div>
      ${travelerCards}
    </div>
    <div class="info-brand">
      <div class="pw-mark" style="margin:0 auto 14px;width:fit-content;">
        <div class="pw-s"></div>
        <div class="pw-s mid"><div class="pw-eye"></div></div>
        <div class="pw-s"></div>
      </div>
      <div class="info-brand-name">BHAKTI &amp; BOUGIE</div>
      <div class="info-brand-email">Questions? michael@bhaktiandbougie.travel</div>
    </div>`;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
}
